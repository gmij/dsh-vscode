name: VSIX Package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - .github/workflows/vsix-package.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static checks and existing tests
        run: |
          npm run check
          npm test
      - name: Produce installable VSIX
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm exec --yes --package @vscode/vsce -- vsce package --no-dependencies --allow-missing-repository --out "dsh-workspace-${VERSION}.vsix"
          test -s "dsh-workspace-${VERSION}.vsix"
          sha256sum "dsh-workspace-${VERSION}.vsix" | tee "dsh-workspace-${VERSION}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-workspace-vsix
          path: |
            dsh-workspace-*.vsix
            dsh-workspace-*.sha256
          retention-days: 30
          if-no-files-found: error
