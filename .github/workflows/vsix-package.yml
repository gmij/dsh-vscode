name: VSIX Package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - .github/workflows/vsix-package.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static checks and existing tests
        run: |
          npm run check
          npm test
      - name: Produce installable VSIX
        run: |
          npm exec --yes --package @vscode/vsce -- vsce package --no-dependencies --allow-missing-repository --out dsh-workspace-0.1.0.vsix
          test -s dsh-workspace-0.1.0.vsix
          sha256sum dsh-workspace-0.1.0.vsix | tee dsh-workspace-0.1.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-workspace-vsix
          path: |
            dsh-workspace-0.1.0.vsix
            dsh-workspace-0.1.0.sha256
          retention-days: 30
          if-no-files-found: error
