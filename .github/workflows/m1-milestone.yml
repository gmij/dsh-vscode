name: M1 Milestone Setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m1-milestone.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync-milestone:
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure unified v0.4–v0.5 GitHub milestone and attach Issue 11
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request
          repo=os.environ['GH_REPO']
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'dsh-milestone-setup'}
          def api(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          title='M1 · DSH Workspace v0.4.0 + v0.5.0'
          milestones=api('GET','/milestones?state=all&per_page=100')
          existing=next((m for m in milestones if m['title']==title),None)
          if existing is None:
              existing=api('POST','/milestones',{'title':title,'description':'统一里程碑：v0.4.0 真实 ACP 聊天与工具/恢复验收 → v0.5.0 Copilot 风格侧栏、会话与模型切换。Issue #11 是统一验收入口。'})
          issue=api('PATCH','/issues/11',{'milestone':existing['number']})
          print(json.dumps({'milestone':existing['html_url'],'issue':issue['html_url'],'milestone_number':existing['number']},ensure_ascii=False))
          PY
