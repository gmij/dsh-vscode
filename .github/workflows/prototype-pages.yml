name: Prototype Pages
run-name: Prototype Pages · DSH run ${{ inputs.source_run_id || github.event.workflow_run.id || '38188700247' }}
on:
  workflow_run:
    workflows: [Issue DSH agent]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing successful DSH Run
        required: true
        default: '38188700247'
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/prototype-pages.yml', '.github/workflows/design-wiki.yml']
permissions:
  contents: read
concurrency:
  group: dsh-vscode-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load pinned verified publishing engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin d8f0ad74d18cafc5786e288027c6eb186376af28
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  build:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[pages-backfill]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pages: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      source_run_id: ${{ inputs.source_run_id || github.event.workflow_run.id || '38188700247' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load pinned verified publishing engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin d8f0ad74d18cafc5786e288027c6eb186376af28
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - id: prepare
        name: Validate real DSH artifacts and prepare Pages
        run: python scripts/prototype_pages.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id || '38188700247' }}
      - name: Configure GitHub Pages
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/prototype-site
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load verified publisher
        shell: bash
        run: |
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin d8f0ad74d18cafc5786e288027c6eb186376af28
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - name: Publish verified links to Issue
        run: python scripts/prototype_pages.py notify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.build.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ needs.build.outputs.source_run_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
