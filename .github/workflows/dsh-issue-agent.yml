name: Issue DSH agent
run-name: "DSH Issue #${{ github.event.issue.number || inputs.issue_number || 'setup' }}"
on:
  issues:
    types: [opened, labeled, assigned, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing open Issue number
        required: true
        type: string
      agent:
        description: Registered agent ID (overview, detailed, prototype, reviewer, connectivity)
        required: true
        default: overview
        type: string
      force:
        description: Retry an identical task (including a failed or cancelled run)
        default: false
        type: boolean
  push:
    paths: ['.github/workflows/dsh-issue-agent.yml', 'src/**', 'test/**', 'package.json']
permissions:
  contents: read
concurrency:
  group: dsh-vscode-issue-${{ github.event.issue.number || inputs.issue_number || 'setup' }}
  cancel-in-progress: false
  queue: max
jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted DSH execution engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin 25fba16cf1d3308e966268510eb7214e77c32395
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  setup:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted DSH execution engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin 25fba16cf1d3308e966268510eb7214e77c32395
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - run: python scripts/issue_agent.py setup
        env:
          GH_TOKEN: ${{ github.token }}
  route:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      run: ${{ steps.route.outputs.run }}
      agent: ${{ steps.route.outputs.agent }}
      issue_number: ${{ steps.route.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted DSH execution engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin 25fba16cf1d3308e966268510eb7214e77c32395
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - id: route
        run: python scripts/issue_agent.py route
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: steps.route.outputs.run == 'true'
        with:
          name: issue-agent-input
          path: ${{ runner.temp }}/issue-agent/
          retention-days: 7
  agent:
    outputs:
      preview: ${{ steps.worker.outputs.preview }}
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted DSH execution engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin 25fba16cf1d3308e966268510eb7214e77c32395
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: issue-agent-input
          path: ${{ runner.temp }}/issue-agent/
      - run: npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-alpha.2
      - name: Restore validated M1 staged checkpoints from failed run
        if: ${{ github.event.issue.number == 11 || inputs.issue_number == '11' }}
        uses: actions/download-artifact@v4
        with:
          name: issue-agent-result
          run-id: 38479651235
          repository: gmij/dsh-vscode
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m1-previous-stages
      - name: Continue M1 design from existing verified checkpoints
        if: ${{ github.event.issue.number == 11 || inputs.issue_number == '11' }}
        shell: bash
        run: |
          set -euo pipefail
          for stage in core tasks pages apis bindings channels prototype; do
            file="$RUNNER_TEMP/m1-previous-stages/stage-$stage.json"
            test -s "$file"
            cp "$file" "$RUNNER_TEMP/issue-agent/stage-$stage.json"
          done
          python - <<'PY'
          import json,os,pathlib
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue-agent'
          for stage in ('core','tasks','pages','apis','bindings','channels','prototype'):
              item=json.loads((folder/f'stage-{stage}.json').read_text())
              assert isinstance(item,dict) and item
              print('Reused checkpoint:',stage, 'bytes:',(folder/f'stage-{stage}.json').stat().st_size)
          PY
      - name: Run registered DSH agent
        id: worker
        run: python scripts/issue_agent.py run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DSH_HOME: ${{ runner.temp }}/dsh-home
      - name: Diagnostics
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/issue-agent/errors.log" ]; then cat "$RUNNER_TEMP/issue-agent/errors.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-agent-result
          path: |
            ${{ runner.temp }}/issue-agent/answer.md
            ${{ runner.temp }}/issue-agent/result.jsonl
            ${{ runner.temp }}/issue-agent/errors.log
            ${{ runner.temp }}/issue-agent/repair-result.jsonl
            ${{ runner.temp }}/issue-agent/repair-errors.log
            ${{ runner.temp }}/issue-agent/contract-error.txt
            ${{ runner.temp }}/issue-agent/stage-*.json
            ${{ runner.temp }}/issue-agent/stage-*.jsonl
            ${{ runner.temp }}/issue-agent/stage-*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success() && steps.worker.outputs.preview == 'true'
        with:
          name: prototype-deliverable
          path: ${{ runner.temp }}/issue-agent/prototype/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success() && (needs.route.outputs.agent == 'overview' || needs.route.outputs.agent == 'detailed')
        with:
          name: design-deliverable
          path: ${{ runner.temp }}/issue-agent/design/
          if-no-files-found: error
          retention-days: 30
  capture:
    needs: agent
    if: needs.agent.outputs.preview == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted DSH execution engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin 25fba16cf1d3308e966268510eb7214e77c32395
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: prototype-deliverable
          path: ${{ runner.temp }}/capture-input
      - name: Install isolated screenshot renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/render" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/render/node_modules/.bin/playwright" install chromium --with-deps
      - name: Capture desktop and mobile prototype screenshots
        run: node scripts/capture_prototype.mjs
        env:
          RENDER_PACKAGE_PATH: ${{ runner.temp }}/render
          PROTOTYPE_DIR: ${{ runner.temp }}/capture-input
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-screenshots
          path: ${{ runner.temp }}/screenshots/
          retention-days: 30
  publish:
    needs: [route, agent]
    if: always() && needs.route.result == 'success' && needs.route.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load trusted DSH execution engine
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dsh-engine"
          git -C "$RUNNER_TEMP/dsh-engine" remote add origin https://github.com/gmij/dsh-actions-connectivity.git
          git -C "$RUNNER_TEMP/dsh-engine" fetch --depth 1 origin 25fba16cf1d3308e966268510eb7214e77c32395
          git -C "$RUNNER_TEMP/dsh-engine" checkout --detach FETCH_HEAD
          cp -R "$RUNNER_TEMP/dsh-engine/agents" .
          cp -R "$RUNNER_TEMP/dsh-engine/scripts/." scripts/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: issue-agent-result
          path: ${{ runner.temp }}/issue-agent/
      - name: Report result to Issue
        run: python scripts/issue_agent.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
          AGENT_ID: ${{ needs.route.outputs.agent }}
          AGENT_RESULT: ${{ needs.agent.result }}
